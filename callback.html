<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in code · EverymanFit</title>
<style>
  :root { --bg:#F3F6FB; --card:#FFFFFF; --text:#14213D; --muted:#56667F; --accent:#06739C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0A1325; --card:#111D35; --text:#EAF1FF; --muted:#8C9DBD; --accent:#7FE3FF; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  code { display:block; background:var(--card); padding:14px; border-radius:10px; word-break:break-all; font-size:14px; }
  button { margin-top:12px; padding:10px 18px; border-radius:10px; border:0; background:var(--accent); color:var(--bg); font-weight:700; cursor:pointer; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>Sign-in finished</h1>
<p id="msg" class="muted">Copy this whole page address and paste it into the terminal that asked for it.</p>
<code id="url"></code>
<button id="copy" type="button">Copy</button>
<script>
  // Shows the page address (it holds the one-time sign-in code). Nothing is sent anywhere.
  var url = document.getElementById("url");
  url.textContent = location.href;
  if (new URLSearchParams(location.search).get("error")) {
    document.getElementById("msg").textContent = "Sign-in was cancelled or failed. Close this tab and try again.";
  }
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(location.href).then(function () { this.textContent = "Copied"; }.bind(this));
  };
</script>
</main>
</body>
</html>
